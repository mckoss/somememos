name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The full check on Node 26 (.nvmrc), the version everything is developed and
  # deployed on.
  check:
    name: Check (Node 26)
    runs-on: ubuntu-latest
    services:
      # For the @somememos/pg-store tests (skipped when SOMEMEMOS_TEST_DATABASE_URL is unset).
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: somememos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d somememos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Privacy guard (no brain data)
        run: node scripts/check-no-brain-data.mjs

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test
        env:
          SOMEMEMOS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/somememos_test

      - name: Build
        run: npm run build

      - name: CLI smoke test
        run: test "$(npx somememos --version)" = "$(node -p "require('./package.json').version")"

      # Browser tests (apps/web/e2e and apps/web/e2e-storage) need Chromium,
      # cached per Playwright version.
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium
        id: chromium-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

      - name: Install Chromium
        if: steps.chromium-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium's system libraries
        if: steps.chromium-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Browser tests
        run: npm run e2e -w @somememos/web
        env:
          # The sync suite (apps/web/e2e/sync*.spec.ts) creates its own database in this server.
          SOMEMEMOS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/somememos_test

  # The CLI, and the two packages it bundles, also support Node 22.13 or later
  # (packages/cli/package.json engines), for agents' environments that still
  # ship Node 22. This job proves it: their unit tests (the bundle test among
  # them) and the one-file bundle run from an empty directory. No browser
  # suites or Postgres here. `npm ci` warns that the workspace root wants
  # Node 26; that is expected.
  cli-node22:
    name: CLI (Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Unit tests (core, sqlite-store, cli)
        run: npx vitest run --project core --project sqlite-store --project cli

      - name: One-file bundle, run from an empty directory
        run: |
          npm run bundle -w @somememos/cli
          mkdir "$RUNNER_TEMP/empty"
          cp packages/cli/bundle/somememos.mjs "$RUNNER_TEMP/empty/somememos"
          cd "$RUNNER_TEMP/empty"
          test "$(./somememos --version)" = "$(node -p "require('$GITHUB_WORKSPACE/package.json').version")"
          ./somememos init brain
          printf '# Kiln log\n\nThe glaze test at cone six came out a deep celadon.\n' > brain/memos/kiln.md
          ./somememos index --brain brain
          ./somememos search celadon --brain brain | grep -q kiln.md
