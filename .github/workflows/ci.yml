name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      # For the @somememos/pg-store tests (skipped when SOMEMEMOS_TEST_DATABASE_URL is unset).
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: somememos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d somememos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Privacy guard (no brain data)
        run: node scripts/check-no-brain-data.mjs

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test
        env:
          SOMEMEMOS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/somememos_test

      - name: Build
        run: npm run build

      - name: CLI smoke test
        run: test "$(npx somememos --version)" = "$(node -p "require('./package.json').version")"
